name: Bug report
description: 报告功能、数据或生产环境问题
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际结果与期望结果。
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 页面 URL
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: 可从 /api/health 获取。
  - type: textarea
    id: evidence
    attributes:
      label: 截图与日志
