name: Vercel Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull Vercel Preview configuration
        run: npx --yes vercel@54.12.2 pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build Preview
        run: npx --yes vercel@54.12.2 build --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@54.12.2 deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- vehicle-campus-hub-vercel-preview -->";
            const body = `${marker}
            ### Vercel Preview
            - URL: ${{ steps.deploy.outputs.url }}
            - Commit: \`${{ github.event.pull_request.head.sha }}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
